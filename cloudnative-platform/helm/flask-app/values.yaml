appLabel: flask-app
versionLabel: v1
environment: production
# replicaCount: 2
containerName: flask-app-container
image:
  repository: kind_flask_app
  tag: latest
  pullPolicy: IfNotPresent
ports:
  - name: "http"
    containerPort: 5000
    protocol: "TCP"
livenessProbe:
  httpGet:
    path: /health/live
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

env:
  - name: FLASK_ENV
    value: development
  - name: FLASK_APP
    value: app.py
  - name: LOG_LEVEL
    value: INFO
  - name: APP_PORT
    value: "5000"
    
service:
  type: ClusterIP
  ports:
    - name: "http"
      port: 5000
      targetPort: 5000
      protocol: "TCP"