apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}-deployment
  namespace: {{ include "app.namespace" . }}
  labels:
    {{ include "app.commonlabels" . | nindent 4 }}
spec:
  {{- if eq .Values.environment "production" }}
  replicas: {{ .Values.replicaCount | default 2 }}
  {{- else }}
  replicas: {{ .Values.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{ include "app.selectorlabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{ include "app.selectorlabels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Values.containerName}}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
        ports:
          {{- with .Values.ports }}
          {{- toYaml . | nindent 10 }}
          {{- else }}
          - name: "http" 
            containerPort: {{ .Values.containerPort }}
            protocol: "TCP"
          {{- end }}
        
        # Liveness Probe
        livenessProbe:
          {{- with .Values.livenessProbe }}
          {{- toYaml . | nindent 10 }}
          {{- else }}
          httpGet:
            path: "/"
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10 
          timeoutSeconds: 1 
          failureThreshold: 3
          {{- end }}
        
        # Readiness Probe
        readinessProbe:
          {{- with .Values.readinessProbe }}
          {{- toYaml . | nindent 10 }}
          {{- else }}
          httpGet:
            path: "/ready" 
            port: 80
          initialDelaySeconds: 5 
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
          {{- end }}
        # Resource limits
        resources:
          {{- with .Values.resources }}
          {{- toYaml . | nindent 10 }}
          {{- else }}
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m" 
            memory: "256Mi"
          {{- end }}
        # Environment variables
        env:
          {{- range .Values.env }}
          - name: {{ .name }}
            value: {{ .value | quote }}
            {{- end }}
