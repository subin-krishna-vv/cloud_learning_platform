apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app: {{ .Values.appLabel}}
    version: {{ .Values.versionLabel}}
spec:
  replicas: {{ .Values.replicaCount | default 2 }}
  selector:
    matchLabels:
      app: {{ .Values.appLabel}}
  template:
    metadata:
      labels:
        app: {{ .Values.appLabel}}
        version: {{ .Values.versionLabel}}
    spec:
      containers:
      - name: {{ .Values.containerName}}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - name: {{ .Values.containerPortName | default "http" }}
          containerPort: {{ .Values.containerPort }}
          protocol: {{ .Values.containerPortProtocol | default "TCP" }}
        
        # Liveness Probe
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.path | default "/health" }}
            port: {{ .Values.livenessProbe.port | default 80 }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 5 }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 10 }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 1 }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 3 }}
        
        # Readiness Probe
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.path | default "/ready" }}
            port: {{ .Values.readinessProbe.port | default 80 }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 5 }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 10 }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 1 }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold | default 3 }}
        
        # Resource limits
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu | default "100m" }}
            memory: {{ .Values.resources.requests.memory |default "128Mi"}}
          limits:
            cpu: {{ .Values.resources.limits.cpu | default "200m" }}
            memory: {{ .Values.resources.limits.memory | default "256Mi" }}
        
        # Environment variables
        env:
          {{- range .Values.env }}
          - name: {{ .name }}
            value: {{ .value | quote }}
            {{- end }}
        # - name: FLASK_ENV
        #   value: "production"
        # - name: LOG_LEVEL
        #   value: "INFO"
        # - name: APP_PORT
        #   value: "5000"
